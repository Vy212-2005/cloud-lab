version: '3.8'

services:
  # Câu 51: Khai báo service backend sử dụng image từ Docker Hub
  backend:
    image: vy212/mern-backend:1.0
    # Câu 53: Ánh xạ port 5000:5000
    ports:
      - "5000:5000"
    # Câu 55: Đọc cấu hình MONGODB_URI từ file .env đã có sẵn
    env_file:
      - ./mern-demo/server/.env

  # Câu 52: Khai báo service frontend sử dụng image từ Docker Hub
  frontend:
    image: vy212/mern-frontend:2.0
    # Câu 54: Ánh xạ port Frontend 3000:3000
    ports:
      - "3000:4173"
    depends_on:
      - backend